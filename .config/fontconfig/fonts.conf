<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Set SF Pro as the primary sans-serif font for Latin/English -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro</family>
      <family>SF Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>SF Pro</family>
      <family>SF Arabic</family>
    </prefer>
  </alias>

  <!-- Optional: Language-specific match for Arabic -->
  <match target="pattern">
    <test compare="contains" name="lang">
      <string>ar</string>
    </test>
    <edit mode="prepend" name="family">
      <string>SF Arabic</string>
    </edit>
  </match>
</fontconfig>
